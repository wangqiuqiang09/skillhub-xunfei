# Small-host deployment profile. It uses the low-resource server image, local
# storage, no scanner, and bounded container memory. Set SKILLHUB_PUBLIC_BASE_URL
# to the address clients use to reach this server before starting the stack.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillhub}
      POSTGRES_USER: ${POSTGRES_USER:-skillhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillhub_demo}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - low_resource_postgres:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillhub} -d ${POSTGRES_DB:-skillhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ${SKILLHUB_LOW_RESOURCE_SERVER_IMAGE:-skillhub-server:low-resource}
    build:
      context: ./server
      dockerfile: Dockerfile.low-resource
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-skillhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-skillhub_demo}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 8
      SPRING_DATA_REDIS_HOST: redis
      SKILLHUB_PUBLIC_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:?set this to the externally reachable server URL}
      SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET: ${SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET:?set a random value of at least 32 characters}
      SKILLHUB_STORAGE_PROVIDER: local
      STORAGE_BASE_PATH: /var/lib/skillhub/storage
      SKILLHUB_SECURITY_SCANNER_ENABLED: "false"
      # Trusted internal profile: visible skills may be published without scan results.
      SKILLHUB_SECURITY_ALLOW_UNSCANNED_VISIBLE_PUBLISH: "true"
      SKILLHUB_BUILTIN_SKILLS_ENABLED: ${SKILLHUB_BUILTIN_SKILLS_ENABLED:-true}
      SKILLHUB_TRACING_MODE: none
      SKILLHUB_LOG_ASYNC_QUEUE_SIZE: 256
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!2026}
    volumes:
      - low_resource_storage:/var/lib/skillhub/storage
    ports:
      - "${API_PORT:-8080}:8080"
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    image: ${SKILLHUB_WEB_IMAGE:-ghcr.io/iflytek/skillhub-web}:${SKILLHUB_VERSION:-latest}
    restart: unless-stopped
    environment:
      SKILLHUB_API_UPSTREAM: http://server:8080
      SKILLHUB_PUBLIC_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:?set this to the externally reachable server URL}
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: 32m
    depends_on:
      server:
        condition: service_healthy

volumes:
  low_resource_postgres:
  low_resource_storage:
